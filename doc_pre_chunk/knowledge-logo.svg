<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <defs>
        <!-- 背景圆渐变 -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF5ED" />
            <stop offset="100%" stop-color="#F2E3D5" />
        </radialGradient>
        
        <!-- 灯泡黄色渐变 -->
        <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD93D" />
            <stop offset="100%" stop-color="#FFC107" />
        </linearGradient>

        <!-- 芯片红色渐变 -->
        <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5E5E" />
            <stop offset="100%" stop-color="#E53935" />
        </linearGradient>

        <!-- 书本蓝色渐变 -->
        <linearGradient id="bookGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#29B6F6" />
            <stop offset="100%" stop-color="#0288D1" />
        </linearGradient>
        <linearGradient id="bookGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#29B6F6" />
            <stop offset="100%" stop-color="#0277BD" />
        </linearGradient>
    </defs>

    <!-- 背景圆 -->
    <circle cx="500" cy="500" r="480" fill="url(#bgGrad)" />

    <!-- ==================== 书本部分 (底层) ==================== -->
    <g id="book">
        <!-- 书本主体轮廓/底色 -->
        <path d="M 130 860 L 130 820 L 220 700 L 500 780 L 780 700 L 870 820 L 870 860 Z" fill="#0D47A1" opacity="0.1" />
        
        <!-- 书本左侧页面 -->
        <path d="M 230 710 C 300 750, 400 760, 500 780 L 500 870 C 400 850, 300 840, 180 860 L 130 820 L 220 700 Z" fill="url(#bookGrad1)" />
        <path d="M 230 710 C 300 750, 400 760, 500 780 L 500 830 C 400 810, 300 800, 190 820 L 140 785 L 220 700 Z" fill="#FFFFFF" opacity="0.15" />

        <!-- 书本右侧页面 -->
        <path d="M 770 710 C 700 750, 600 760, 500 780 L 500 870 C 600 850, 700 840, 820 860 L 870 820 L 780 700 Z" fill="url(#bookGrad2)" />
        <path d="M 770 710 C 700 750, 600 760, 500 780 L 500 830 C 600 810, 700 800, 810 820 L 860 785 L 780 700 Z" fill="#FFFFFF" opacity="0.15" />

        <!-- 书本底部边缘 / 书脊 -->
        <path d="M 125 840 C 200 860, 400 875, 500 870 C 600 875, 800 860, 875 840 L 875 865 C 800 885, 600 900, 500 895 C 400 900, 200 885, 125 865 Z" fill="#26A69A" />
        <path d="M 125 840 C 200 860, 400 875, 500 870 C 600 875, 800 860, 875 840 L 875 850 C 800 870, 600 885, 500 880 C 400 885, 200 870, 125 850 Z" fill="#004D40" opacity="0.3" />

        <!-- 书本轮廓描边 -->
        <path d="M 230 710 C 300 750, 400 760, 500 780 L 500 870 C 400 850, 300 840, 180 860 L 130 820 L 220 700" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 770 710 C 700 750, 600 760, 500 780 L 500 870 C 600 850, 700 840, 820 860 L 870 820 L 780 700" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 125 840 C 200 860, 400 875, 500 870 C 600 875, 800 860, 875 840" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- ==================== 灯泡部分 (中层) ==================== -->
    <g id="lightbulb">
        <!-- 灯泡玻璃体 -->
        <path d="M 500 180 
                 C 380 180, 290 280, 290 400 
                 C 290 460, 320 510, 360 550 
                 C 380 570, 395 580, 405 600
                 L 410 630
                 L 590 630
                 L 595 600
                 C 605 580, 620 570, 640 550
                 C 680 510, 710 460, 710 400
                 C 710 280, 620 180, 500 180 Z" 
              fill="url(#bulbGrad)" />
        
        <!-- 灯泡高光 -->
        <path d="M 340 350 C 350 250, 420 210, 480 200 C 400 220, 350 300, 340 350 Z" fill="#FFFFFF" opacity="0.3" />

        <!-- 灯泡底座 (绿色部分) -->
        <path d="M 420 630 L 580 630 L 590 670 L 560 730 L 440 730 L 410 670 Z" fill="#26A69A" />
        <path d="M 430 670 L 570 670 L 550 710 L 450 710 Z" fill="#004D40" opacity="0.2" />
        <path d="M 450 730 L 550 730 L 540 760 L 460 760 Z" fill="#26A69A" />
        <path d="M 460 760 L 540 760 L 520 780 L 480 780 Z" fill="#004D40" opacity="0.2" />

        <!-- 灯泡轮廓描边 -->
        <path d="M 500 180 
                 C 380 180, 290 280, 290 400 
                 C 290 460, 320 510, 360 550 
                 C 380 570, 395 580, 405 600
                 L 410 630
                 L 590 630
                 L 595 600
                 C 605 580, 620 570, 640 550
                 C 680 510, 710 460, 710 400
                 C 710 280, 620 180, 500 180 Z" 
              fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- 底座描边 -->
        <path d="M 420 630 L 580 630 L 590 670 L 560 730 L 440 730 L 410 670 Z" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 450 730 L 550 730 L 540 760 L 460 760 Z" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 460 760 L 540 760 L 520 780 L 480 780 Z" fill="none" stroke="#4E342E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- ==================== 芯片部分 (顶层) ==================== -->
    <g id="chip">
        <!-- 芯片主体背景 -->
        <rect x="370" y="270" width="260" height="260" rx="30" fill="url(#chipGrad)" />
        <rect x="370" y="270" width="260" height="260" rx="30" fill="none" stroke="#4E342E" stroke-width="18" stroke-linejoin="round" />

        <!-- 芯片内部核心方块 -->
        <rect x="420" y="320" width="160" height="160" rx="20" fill="#FF8A80" />
        <rect x="420" y="320" width="160" height="160" rx="20" fill="none" stroke="#4E342E" stroke-width="14" stroke-linejoin="round" />
        
        <!-- 芯片内部小核心 -->
        <rect x="450" y="370" width="100" height="60" fill="#FF5252" />
        <rect x="450" y="370" width="100" height="60" fill="none" stroke="#4E342E" stroke-width="10" stroke-linejoin="round" />

        <!-- 芯片引脚 (上) -->
        <g fill="#4E342E">
            <!-- 左侧引脚 -->
            <rect x="350" y="290" width="25" height="15" rx="5" />
            <rect x="350" y="325" width="25" height="15" rx="5" />
            <rect x="350" y="360" width="25" height="15" rx="5" />
            <rect x="350" y="400" width="25" height="15" rx="5" />
            <rect x="350" y="440" width="25" height="15" rx="5" />
            <rect x="350" y="475" width="25" height="15" rx="5" />

            <!-- 右侧引脚 -->
            <rect x="625" y="290" width="25" height="15" rx="5" />
            <rect x="625" y="325" width="25" height="15" rx="5" />
            <rect x="625" y="360" width="25" height="15" rx="5" />
            <rect x="625" y="400" width="25" height="15" rx="5" />
            <rect x="625" y="440" width="25" height="15" rx="5" />
            <rect x="625" y="475" width="25" height="15" rx="5" />

            <!-- 顶部引脚 -->
            <rect x="410" y="240" width="15" height="25" rx="5" />
            <rect x="445" y="240" width="15" height="25" rx="5" />
            <rect x="480" y="240" width="15" height="25" rx="5" />
            <rect x="505" y="240" width="15" height="25" rx="5" />
            <rect x="540" y="240" width="15" height="25" rx="5" />
            <rect x="575" y="240" width="15" height="25" rx="5" />

            <!-- 底部引脚 -->
            <rect x="410" y="535" width="15" height="25" rx="5" />
            <rect x="445" y="535" width="15" height="25" rx="5" />
            <rect x="480" y="535" width="15" height="25" rx="5" />
            <rect x="505" y="535" width="15" height="25" rx="5" />
            <rect x="540" y="535" width="15" height="25" rx="5" />
            <rect x="575" y="535" width="15" height="25" rx="5" />
        </g>
    </g>

    <!-- ==================== 发光射线 (背景装饰) ==================== -->
    <g id="rays" stroke="#4E342E" stroke-width="18" stroke-linecap="round">
        <!-- 顶部射线 -->
        <line x1="500" y1="80" x2="500" y2="140" />
        
        <!-- 右上射线 -->
        <line x1="635" y1="145" x2="595" y2="195" />
        
        <!-- 右侧射线 -->
        <line x1="750" y1="390" x2="690" y2="390" />
        
        <!-- 右下射线 (短) -->
        <line x1="735" y1="260" x2="685" y2="280" />

        <!-- 左上射线 -->
        <line x1="365" y1="145" x2="405" y2="195" />
        
        <!-- 左侧射线 -->
        <line x1="250" y1="390" x2="310" y2="390" />
        
        <!-- 左下射线 (短) -->
        <line x1="265" y1="260" x2="315" y2="280" />
    </g>

</svg>